name: CI

on:
  push:
    branches: [main, Development-Branch]
  pull_request:
    branches: [main, Development-Branch]

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/XlentMatch.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet restore ../../tests/XlentMatch.Api.Tests/XlentMatch.Api.Tests.csproj
      - run: dotnet test ../../tests/XlentMatch.Api.Tests/XlentMatch.Api.Tests.csproj --configuration Release --no-restore
      - run: dotnet tool install --global dotnet-ef --version 10.0.0
      - run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/XlentMatch.Web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/XlentMatch.Web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
