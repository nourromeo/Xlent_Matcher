name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/XlentMatch.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet tool install --global dotnet-ef --version 10.0.0
      - run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/XlentMatch.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/XlentMatch.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
